<!DOCTYPE html>
<html>
<head>

<title>Car Price Prediction</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:'Segoe UI',sans-serif;

    background:linear-gradient(135deg,#1e3c72,#2a5298);

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{

    width:650px;

    background:white;

    padding:35px;

    border-radius:20px;

    border:3px solid #d6e4ff;

    box-shadow:0px 8px 25px rgba(0,0,0,0.3);
}

h1{

    text-align:center;
    color:#1e3c72;

    margin-bottom:10px;
}

.subtitle{

    text-align:center;

    color:#666;

    margin-bottom:25px;
}

label{

    display:block;

    margin-top:12px;

    font-weight:bold;

    color:#333;
}

input,select{

    width:100%;

    padding:12px;

    border:1px solid #ccc;

    border-radius:8px;

    margin-top:5px;

    box-sizing:border-box;
}

input:focus,
select:focus{

    outline:none;

    border:2px solid #1e3c72;
}

button{

    width:100%;

    margin-top:25px;

    padding:14px;

    border:none;

    border-radius:10px;

    background:#1e3c72;

    color:white;

    font-size:18px;

    cursor:pointer;
}

button:hover{

    background:#16315e;
}

.footer{

    text-align:center;

    margin-top:20px;

    color:#777;
}

</style>

</head>

<body>

<div class="container">

<h1>🚗 Car Price Prediction</h1>

<p class="subtitle">
Predict Used Car Selling Price using Machine Learning
</p>

<form action="/predict" method="POST">

<label>Manufacturing Year</label>
<input type="number" name="year" required>

<label>Present Price (Lakhs)</label>
<input type="number" step="0.01" name="present_price" required>

<label>Kilometers Driven</label>
<input type="number" name="kms_driven" required>

<label>Fuel Type</label>
<select name="fuel_type">
<option value="Petrol">Petrol</option>
<option value="Diesel">Diesel</option>
</select>

<label>Seller Type</label>
<select name="seller_type">
<option value="Dealer">Dealer</option>
<option value="Individual">Individual</option>
</select>

<label>Transmission</label>
<select name="transmission">
<option value="Manual">Manual</option>
<option value="Automatic">Automatic</option>
</select>

<label>Owner Count</label>
<input type="number" name="owner" min="0" required>

<button type="submit">
Predict Car Price
</button>

</form>

<div class="footer">
Multiple Linear Regression | Flask | Machine Learning
</div>

</div>

</body>
</html>
