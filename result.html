<!DOCTYPE html>
<html>
<head>

<title>Prediction Result</title>

<style>

body{

    margin:0;

    font-family:'Segoe UI',sans-serif;

    background:linear-gradient(135deg,#11998e,#38ef7d);

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;
}

.card{

    width:550px;

    background:white;

    padding:40px;

    border-radius:20px;

    border:3px solid #d8ffe6;

    text-align:center;

    box-shadow:0px 10px 25px rgba(0,0,0,0.3);
}

h1{

    color:#11998e;
}

.price{

    font-size:42px;

    color:#27ae60;

    font-weight:bold;

    margin:25px 0;
}

a{

    text-decoration:none;

    background:#11998e;

    color:white;

    padding:12px 25px;

    border-radius:10px;
}

a:hover{

    background:#0e7d73;
}

</style>

</head>

<body>

<div class="card">

<h1>Prediction Result</h1>

<p>Estimated Selling Price</p>

<div class="price">

₹ {{ prediction }} Lakhs

</div>

<a href="/">Predict Another Car</a>

</div>

</body>
</html>
